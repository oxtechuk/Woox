# =====================================================================
# Supervisor Configuration for Laravel Queue Workers & Reverb WebSockets
# Place in: /etc/supervisor/conf.d/wox.conf
# =====================================================================

[program:wox-queue]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/Wox-Lv/artisan queue:work redis --sleep=3 --tries=3 --max-time=3600 --timeout=90
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=4
redirect_stderr=true
stdout_logfile=/var/log/supervisor/wox-queue.log
stopwaitsecs=3600

[program:wox-reverb]
process_name=%(program_name)s
command=php /var/www/Wox-Lv/artisan reverb:start --host=0.0.0.0 --port=8080
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
redirect_stderr=true
stdout_logfile=/var/log/supervisor/wox-reverb.log
stopwaitsecs=60

