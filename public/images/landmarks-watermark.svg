<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" width="600" height="200" fill="none">
  <!-- Soft skyline silhouette of Saudi Arabia (Kingdom Tower / Faisaliah) & Egypt (Giza Pyramids) -->
  <g fill="#D8CDBA" opacity="0.38">
    <!-- Giza Pyramids (Left to Center) -->
    <!-- Distant small pyramid -->
    <polygon points="60,195 110,135 160,195" />
    <!-- Khufu Great Pyramid -->
    <polygon points="120,195 210,85 300,195" />
    <!-- Khafre Pyramid -->
    <polygon points="260,195 335,105 410,195" />
    <!-- Menkaure Pyramid -->
    <polygon points="380,195 435,145 490,195" />
  </g>
  <g fill="#C7BCA8" opacity="0.45">
    <!-- Cairo Tower / Minaret silhouette -->
    <rect x="425" y="60" width="10" height="135" rx="2" />
    <polygon points="423,60 430,30 437,60" />
    <circle cx="430" cy="25" r="3" />
    
    <!-- Modern Riyadh Skyline (Right side) -->
    <!-- Al Faisaliah Tower -->
    <polygon points="475,195 488,40 501,195" />
    <circle cx="488" cy="85" r="7" fill="#B3A58E" />
    <line x1="488" y1="40" x2="488" y2="15" stroke="#B3A58E" stroke-width="2" />
    
    <!-- Kingdom Centre Tower (Iconic inverted parabolic arch at top) -->
    <path d="M520,195 L530,20 L560,20 L570,195 Z" />
    <!-- Inverted arch cutout -->
    <path d="M536,20 Q545,65 554,20 Z" fill="#FAF8F5" />
    <rect x="543" y="15" width="4" height="6" fill="#FAF8F5" />
  </g>
  <!-- Subtle ground dunes -->
  <path d="M0,195 Q150,185 300,192 T600,190 L600,200 L0,200 Z" fill="#D8CDBA" opacity="0.3" />
</svg>
